<!-- ============ JAVASCRIPT ============ -->
<script>
document.addEventListener('DOMContentLoaded', () => {

  // 1. Mobile Menu Toggle
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  if (navToggle && navLinks) {
    navToggle.addEventListener('click', () => {
      const isOpen = navLinks.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', isOpen);
    });
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        navLinks.classList.remove('open');
        navToggle.setAttribute('aria-expanded', 'false');
      });
    });
  }

  // 2. Navbar Scroll Shadow
  const navbar = document.getElementById('navbar');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 20) {
      navbar.classList.add('is-scrolled');
    } else {
      navbar.classList.remove('is-scrolled');
    }
  });

  // 3. Scroll Reveal Animation
  const reveals = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
      }
    });
  }, { threshold: 0.1 });
  reveals.forEach(el => observer.observe(el));

  // 4. Portfolio Filters
  const filterBtns = document.querySelectorAll('.filter-btn');
  const cards = document.querySelectorAll('.card');

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const filter = btn.getAttribute('data-filter');
      cards.forEach(card => {
        const cat = card.getAttribute('data-category');
        if (filter === 'todos' || filter === cat) {
          card.classList.remove('is-hidden');
        } else {
          card.classList.add('is-hidden');
        }
      });
    });
  });

  // 5. Crosshair Coordinates on MouseMove
  cards.forEach(card => {
    const crosshair = card.querySelector('.crosshair');
    const coordSpan = card.querySelector('.coord');
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = Math.round(e.clientX - rect.left);
      const y = Math.round(e.clientY - rect.top);
      if (crosshair) {
        crosshair.style.left = `${x}px`;
        crosshair.style.top = `${y}px`;
      }
      if (coordSpan) {
        coordSpan.textContent = `X:${x} Y:${y}`;
      }
    });
  });

  // 6. Lightbox Interactivity
  const lightbox = document.getElementById('lightbox');
  const lightboxClose = document.getElementById('lightboxClose');
  const lightboxMedia = document.getElementById('lightboxMedia');
  const lightboxTag = document.getElementById('lightboxTag');
  const lightboxTitle = document.getElementById('lightboxTitle');
  const lightboxDesc = document.getElementById('lightboxDesc');
  const lightboxClient = document.getElementById('lightboxClient');

  cards.forEach(card => {
    card.addEventListener('click', () => {
      const title = card.getAttribute('data-title');
      const desc = card.getAttribute('data-desc');
      const client = card.getAttribute('data-client');
      const tag = card.querySelector('.card-tag').textContent;
      const mediaHtml = card.querySelector('.card-media').innerHTML;

      lightboxTag.textContent = tag;
      lightboxTitle.textContent = title;
      lightboxDesc.textContent = desc;
      lightboxClient.textContent = client;
      lightboxMedia.innerHTML = mediaHtml;

      // Remove unwanted overlays in lightbox
      const extraOverlay = lightboxMedia.querySelector('.card-overlay');
      const extraCrosshair = lightboxMedia.querySelector('.crosshair');
      if (extraOverlay) extraOverlay.remove();
      if (extraCrosshair) extraCrosshair.remove();

      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  });

  const closeLightbox = () => {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  };

  if (lightboxClose) lightboxClose.addEventListener('click', closeLightbox);
  if (lightbox) {
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
  });

  // 7. Simple Form Validation Placeholder
  const contactForm = document.getElementById('contactForm');
  const formMsg = document.getElementById('formMsg');
  if (contactForm) {
    contactForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();

      if (!name || !email || !message) {
        formMsg.textContent = 'Por favor, completa todos los campos.';
        return;
      }

      formMsg.style.color = '#2ce578';
      formMsg.textContent = '¡Mensaje listo! Redirigiendo a tu cliente de correo...';
      
      setTimeout(() => {
        window.location.href = `mailto:hola@mcstudio.cl?subject=Contacto desde la Web - ${encodeURIComponent(name)}&body=${encodeURIComponent(message)}`;
        contactForm.reset();
        formMsg.textContent = '';
      }, 1200);
    });
  }

});
</script>
</body>
</html>
