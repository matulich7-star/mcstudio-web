<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Estudio | Diseño Espacial & Retail</title>
    <!-- Fuente Montserrat desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- RESETS GENERALES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
        }

        /* --- HEADER / ENCABEZADO --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: rgba(18, 18, 18, 0.95);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo a {
            color: #FFFFFF;
            font-weight: 800;
            font-size: 1.5rem;
            text-decoration: none;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: #d1d1d1;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #ff5522;
        }

        /* Botón Destacado del Menú */
        .btn-contacto {
            background-color: #ff5522;
            color: #ffffff !important;
            padding: 10px 22px;
            border-radius: 4px;
            font-weight: 600;
            transition: background-color 0.3s ease !important;
        }

        .btn-contacto:hover {
            background-color: #e04411 !important;
        }

        /* --- HERO SECTION --- */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), 
                        url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1920') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            margin-top: 60px;
        }

        .hero-content {
            max-width: 900px;
        }

        .kicker {
            color: #ff5522;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .main-title {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1.1;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1rem;
            color: #cccccc;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 35px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-main {
            display: inline-block;
            background-color: #ff5522;
            color: #ffffff;
            padding: 14px 36px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .btn-main:hover {
            background-color: #e04411;
            transform: translateY(-2px);
        }

        /* --- ADAPTABILIDAD MÓVIL --- */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 5%;
            }
            .nav-links {
                gap: 15px;
            }
            .nav-links a {
                font-size: 0.75rem;
            }
            .main-title {
                font-size: 2.1rem;
            }
            .subtitle {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- MENÚ DE NAVEGACIÓN -->
    <header class="navbar">
        <div class="logo">
            <a href="#">MC ESTUDIO</a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="#proyectos">PROYECTOS</a></li>
                <li><a href="#servicios">SERVICIOS</a></li>
                <li><a href="#contacto" class="btn-contacto">CONTACTO</a></li>
            </ul>
        </nav>
    </header>

    <!-- SECCIÓN PRINCIPAL (HERO) -->
    <section class="hero">
        <div class="hero-content">
            <p class="kicker">Visual Merchandising & POS</p>
            <h1 class="main-title">Diseño Espacial & Retail</h1>
            <p class="subtitle">Planimetrías, exhibidores, vitrinismo y material POP para proyectar tu marca en el punto de venta.</p>
            <a href="#proyectos" class="btn-main">VER TRABAJOS</a>
        </div>
    </section>

</body>
</html>
